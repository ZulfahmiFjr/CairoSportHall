<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cairo Sport Hall Smart Lamp</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <!-- nyambungin file cssnyaa kesini -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ini bagian layar penuh nutupin tombol buat masuk pertama kali -->
  <div id="login-container">
    <div class="login-box">
      <h2>Masuk</h2>
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Masukkan Username Anda">
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan Password Anda">
      </div>
      <button class="btn-login" id="btn-login">Login</button>
      <div id="login-error"></div>
    </div>
  </div>

  <!-- ini tempat nongkrong utama semua tombol saklarnyaa -->
  <div id="dashboard-container">
    <div class="top-bar">
      <button class="btn-logout" id="btn-logout">Keluar</button>
    </div>
    <div class="header-container">
      <h1>Cairo Sport Hall Smart Lamp</h1>
      <div id="conn-status" class="connection-status status-online">Koneksi Anda: Mengecek...</div>
      <div id="device-status" class="connection-status status-offline">Koneksi Alat: Mengecek...</div>
    </div>
    <div class="grid-container" id="saklar-container">
      <!-- tombolnyaa bakal digenerate otomatis pakai javascript -->
    </div>
  </div>

  <!-- modal popup buat ngatur jadwal nyala mati otomatis -->
  <div id="schedule-modal" class="modal-container" style="display: none;">
    <div class="modal-box">
      <h2 id="modal-title">Atur Jadwal</h2>
      <div class="input-group">
        <label>
          <input type="checkbox" id="schedule-active"> Aktifkan Jadwal Otomatis
        </label>
      </div>
      <div class="input-group">
        <label>Waktu Hidup</label>
        <input type="time" id="time-on">
      </div>
      <div class="input-group">
        <label>Waktu Mati</label>
        <input type="time" id="time-off">
      </div>
      <div class="input-group">
        <label>Hari Berulang</label>
        <div class="days-container">
          <label><input type="checkbox" id="day-1"> Sen</label>
          <label><input type="checkbox" id="day-2"> Sel</label>
          <label><input type="checkbox" id="day-3"> Rab</label>
          <label><input type="checkbox" id="day-4"> Kam</label>
          <label><input type="checkbox" id="day-5"> Jum</label>
          <label><input type="checkbox" id="day-6"> Sab</label>
          <label><input type="checkbox" id="day-0"> Min</label>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-matikan" id="btn-cancel-schedule">Batal</button>
        <button class="btn btn-hidupkan" id="btn-save-schedule">Simpan Pengaturan</button>
      </div>
    </div>
  </div>

  <!-- manggil script jsnyaa pakai tipe module biar import firebasenyaa jalan -->
  <script type="module" src="app.js"></script>
</body>

</html>
