<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cairo Sport Hall Smart Lamp</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      position: relative;
    }

    /* css buat kotak loginnyaa */
    #login-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 32, 39, 0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-box h2 {
      margin-top: 0;
      font-size: 2rem;
      margin-bottom: 30px;
      background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #cbd5e1;
      font-size: 0.9rem;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.2);
      color: white;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
      transition: border 0.3s ease;
    }

    .input-group input:focus {
      border: 1px solid #4facfe;
    }

    .btn-login {
      background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
      color: #0f2027;
      margin-top: 10px;
      border: none;
      padding: 14px 28px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 800;
      font-size: 1.15rem;
      width: 100%;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(79, 172, 254, 0.6);
    }

    /* css buat nampilin error pas login */
    #login-error {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 15px;
      display: none;
    }

    /* css buat bungkus utama aplikasinyaa */
    #dashboard-container {
      width: 100%;
      max-width: 1200px;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      margin-bottom: 10px;
    }

    .btn-logout {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .btn-logout:hover {
      background: rgba(248, 113, 113, 0.2);
      border-color: #f87171;
      color: #f87171;
    }

    .header-container {
      text-align: center;
      margin-bottom: 30px;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    h1 {
      font-weight: 800;
      margin: 0;
      font-size: 2.8rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
      letter-spacing: 1px;
      background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .connection-status {
      font-size: 1rem;
      padding: 8px 20px;
      border-radius: 30px;
      display: inline-block;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .status-online {
      color: #4ade80;
      border: 1px solid #4ade80;
    }

    .status-offline {
      color: #f87171;
      border: 1px solid #f87171;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
      width: 100%;
    }

    .lamp-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px 25px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border 0.3s ease;
    }

    .lamp-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .lamp-title {
      font-size: 1.6rem;
      font-weight: 600;
      margin: 0 0 10px 0;
      color: #f8fafc;
    }

    .lamp-status-text {
      font-size: 0.95rem;
      margin-bottom: 25px;
      color: #cbd5e1;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 800;
      font-size: 1.15rem;
      width: 100%;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn-matikan {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: white;
    }

    .btn-matikan:not(:disabled):hover {
      box-shadow: 0 6px 20px rgba(56, 239, 125, 0.5);
      transform: scale(1.03);
    }

    .btn-hidupkan {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: white;
    }

    .btn-hidupkan:not(:disabled):hover {
      box-shadow: 0 6px 20px rgba(255, 65, 108, 0.5);
      transform: scale(1.03);
    }

    /* css buat modal popup pengaturan jadwal */
    .modal-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 32, 39, 0.85);
      backdrop-filter: blur(10px);
      z-index: 2000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      color: white;
    }

    .modal-box h2 {
      margin-top: 0;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }

    .days-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .days-container label {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.1);
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }

    .btn-schedule {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-bottom: 15px;
      width: 100%;
      transition: all 0.3s;
    }

    .btn-schedule:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

<body>

  <!-- ini bagian layar penuh nutupin tombol buat masuk pertama kali -->
  <div id="login-container">
    <div class="login-box">
      <h2>Masuk</h2>
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Masukkan Username Anda">
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan Password Anda">
      </div>
      <button class="btn-login" id="btn-login">Login</button>
      <div id="login-error"></div>
    </div>
  </div>

  <!-- ini tempat nongkrong utama semua tombol saklarnyaa -->
  <div id="dashboard-container">
    <div class="top-bar">
      <button class="btn-logout" id="btn-logout">Keluar</button>
    </div>
    <div class="header-container">
      <h1>Cairo Sport Hall Smart Lamp</h1>
      <div id="conn-status" class="connection-status status-online">Koneksi Anda: Mengecek...</div>
      <div id="device-status" class="connection-status status-offline">Koneksi Alat: Mengecek...</div>
    </div>
    <div class="grid-container" id="saklar-container">
      <!-- tombolnyaa bakal digenerate otomatis pakai javascript -->
    </div>
  </div>

  <!-- modal popup buat ngatur jadwal nyala mati otomatis -->
  <div id="schedule-modal" class="modal-container" style="display: none;">
    <div class="modal-box">
      <h2 id="modal-title">Atur Jadwal</h2>
      <div class="input-group">
        <label>
          <input type="checkbox" id="schedule-active"> Aktifkan Jadwal Otomatis
        </label>
      </div>
      <div class="input-group">
        <label>Waktu Hidup</label>
        <input type="time" id="time-on">
      </div>
      <div class="input-group">
        <label>Waktu Mati</label>
        <input type="time" id="time-off">
      </div>
      <div class="input-group">
        <label>Hari Berulang</label>
        <div class="days-container">
          <label><input type="checkbox" id="day-1"> Sen</label>
          <label><input type="checkbox" id="day-2"> Sel</label>
          <label><input type="checkbox" id="day-3"> Rab</label>
          <label><input type="checkbox" id="day-4"> Kam</label>
          <label><input type="checkbox" id="day-5"> Jum</label>
          <label><input type="checkbox" id="day-6"> Sab</label>
          <label><input type="checkbox" id="day-0"> Min</label>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-matikan" id="btn-cancel-schedule">Batal</button>
        <button class="btn btn-hidupkan" id="btn-save-schedule">Simpan Pengaturan</button>
      </div>
    </div>
  </div>

  <script type="module">
    // ngambil fungsi fungsi penting dari firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
    // config dari firebasenyaa
    const firebaseConfig = {
      apiKey: "AIzaSyCIPJKs36oEABoh_tRbMEpOELhGyx-Bq40",
      authDomain: "cairosporthall.firebaseapp.com",
      databaseURL: "https://cairosporthall-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cairosporthall",
      storageBucket: "cairosporthall.firebasestorage.app",
      messagingSenderId: "180648731836",
      appId: "1:180648731836:web:c223df91836d6cdd821cb9",
      measurementId: "G-0PP7BPGX9G"
    };
    // nyalain layanan firebase sama authnyaa juga
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    // siapin semua elemen html yang mau diotak atik
    const loginContainer = document.getElementById('login-container');
    const dashboardContainer = document.getElementById('dashboard-container');
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginError = document.getElementById('login-error');
    const container = document.getElementById('saklar-container');
    const connStatusEl = document.getElementById('conn-status');
    const deviceStatusEl = document.getElementById('device-status');
    // elemen buat ngatur popup jadwal
    const scheduleModal = document.getElementById('schedule-modal');
    const modalTitle = document.getElementById('modal-title');
    const scheduleActive = document.getElementById('schedule-active');
    const timeOn = document.getElementById('time-on');
    const timeOff = document.getElementById('time-off');
    const btnCancelSchedule = document.getElementById('btn-cancel-schedule');
    const btnSaveSchedule = document.getElementById('btn-save-schedule');
    let relayJadwalAktif = 0;
    let isOnline = navigator.onLine;
    let waktuDetakTerakhir = 0;
    // pantengin terus status loginnyaa trus hilangin atau nampilin kotak login
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginContainer.style.display = 'none';
        dashboardContainer.style.display = 'flex';
        updateConnectionStatus();
      } else {
        loginContainer.style.display = 'flex';
        dashboardContainer.style.display = 'none';
      }
    });
    // pas tombol login dipencet kita gabungin username yang diinput sama string emailnyaa
    btnLogin.addEventListener('click', () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      if (!username || !password) {
        loginError.innerText = "Mohon lengkapi Username dan Password Anda.";
        loginError.style.display = 'block';
        return;
      }
      const emailBuatan = username + "@cairo.com";
      btnLogin.innerText = "Memuat...";
      btnLogin.disabled = true;
      signInWithEmailAndPassword(auth, emailBuatan, password).then(() => {
        loginError.style.display = 'none';
        btnLogin.innerText = "Login";
        btnLogin.disabled = false;
        usernameInput.value = '';
        passwordInput.value = '';
      }).catch((error) => {
        loginError.innerText = "Login gagal. Pastikan Username dan Password sudah benar.";
        loginError.style.display = 'block';
        btnLogin.innerText = "Login";
        btnLogin.disabled = false;
      });
    });
    // kalau udah beres trus pengen keluar pencet tombol yang ini aja
    btnLogout.addEventListener('click', () => {
      signOut(auth);
    });
    // nah ini fungsi buat ngatur tampilan status koneksinyaa
    function updateConnectionStatus() {
      isOnline = navigator.onLine;
      const buttons = document.querySelectorAll('.lamp-card .btn');
      if (isOnline) {
        connStatusEl.innerText = "Koneksi Anda: Terhubung";
        connStatusEl.className = "connection-status status-online";
        buttons.forEach(btn => btn.disabled = false);
      } else {
        connStatusEl.innerText = "Koneksi Anda: Terputus";
        connStatusEl.className = "connection-status status-offline";
        buttons.forEach(btn => btn.disabled = true);
      }
    }
    // pasang kuping buat dengerin perubahan koneksi internet di browser
    window.addEventListener('online', updateConnectionStatus);
    window.addEventListener('offline', updateConnectionStatus);
    // ngecek status koneksi langsung ke firebase pakai jalur khusus connected
    const connectedRef = ref(db, ".info/connected");
    onValue(connectedRef, (snap) => {
      isOnline = snap.val() === true && navigator.onLine;
      updateConnectionStatus();
    });
    // mantau detak jantung esp32 secara realtime
    const heartbeatRef = ref(db, "stopkontak/heartbeat");
    onValue(heartbeatRef, (snapshot) => {
      if (snapshot.exists()) {
        waktuDetakTerakhir = Date.now();
      }
    });
    // ngecek status idup matinyaa esp32 tiap tiga detik
    setInterval(() => {
      const selisihWaktu = Date.now() - waktuDetakTerakhir;
      if (selisihWaktu > 20000) {
        deviceStatusEl.innerText = "Koneksi Alat: Terputus";
        deviceStatusEl.className = "connection-status status-offline";
      } else {
        deviceStatusEl.innerText = "Koneksi Alat: Terhubung";
        deviceStatusEl.className = "connection-status status-online";
      }
    }, 3000);
    // ini buat ngehasilin delapan kotak tombol berurutan pakai loop
    for (let i = 1; i <= 8; i++) {
      const card = document.createElement('div');
      card.className = 'lamp-card';
      const title = document.createElement('h3');
      title.className = 'lamp-title';
      title.innerText = `Lampu ${i}`;
      const statusText = document.createElement('p');
      statusText.className = 'lamp-status-text';
      statusText.innerText = 'Memuat status...';
      const btnJadwal = document.createElement('button');
      btnJadwal.className = 'btn-schedule';
      btnJadwal.innerText = '⚙️ Atur Jadwal';
      btnJadwal.addEventListener('click', () => {
        bukaModalJadwal(i);
      });
      const btn = document.createElement('button');
      btn.id = `btn-${i}`;
      btn.className = 'btn btn-hidupkan';
      btn.innerText = 'Hidupkan';
      // lempar data ke firebase pas tombol saklarnyaa diklik
      btn.addEventListener('click', () => {
        if (!isOnline) return;
        const statusSekarang = btn.classList.contains('btn-matikan') ? 0 : 1;
        set(ref(db, `stopkontak/relay${i}`), statusSekarang);
      });
      card.appendChild(title);
      card.appendChild(btnJadwal);
      card.appendChild(statusText);
      card.appendChild(btn);
      container.appendChild(card);
      // pantengin terus data dari firebase secara langsung tanpa delay
      const relayRef = ref(db, `stopkontak/relay${i}`);
      onValue(relayRef, (snapshot) => {
        const data = snapshot.val();
        if (data === 1) {
          btn.className = 'btn btn-matikan';
          btn.innerText = 'Matikan';
          statusText.innerText = 'Lampu saat ini sedang hidup';
        } else {
          btn.className = 'btn btn-hidupkan';
          btn.innerText = 'Hidupkan';
          statusText.innerText = 'Lampu saat ini sedang mati';
        }
      });
    }
    // nampilin modal jadwal trus narik data langsung dari firebase biar akurat
    function bukaModalJadwal(relayId) {
      if (!isOnline) {
        alert("Peringatan: Tidak ada koneksi internet. Gagal memuat jadwal.");
        return;
      }
      relayJadwalAktif = relayId;
      modalTitle.innerText = `Atur Jadwal Lampu ${relayId}`;
      scheduleModal.style.display = 'flex';
      scheduleActive.checked = false;
      timeOn.value = '';
      timeOff.value = '';
      for (let i = 0; i <= 6; i++) {
        document.getElementById(`day-${i}`).checked = false;
      }
      get(ref(db, `jadwal/relay${relayId}`)).then((snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          scheduleActive.checked = data.aktif || false;
          if (data.jamNyala !== undefined && data.menitNyala !== undefined && data.jamNyala >= 0) {
            timeOn.value = `${String(data.jamNyala).padStart(2, '0')}:${String(data.menitNyala).padStart(2, '0')}`;
          }
          if (data.jamMati !== undefined && data.menitMati !== undefined && data.jamMati >= 0) {
            timeOff.value = `${String(data.jamMati).padStart(2, '0')}:${String(data.menitMati).padStart(2, '0')}`;
          }
          for (let i = 0; i <= 6; i++) {
            document.getElementById(`day-${i}`).checked = data[`hari${i}`] || false;
          }
        }
      }).catch(() => {
        alert("Kesalahan: Gagal memuat data jadwal dari server.");
      });
    }
    // tutup modalnyaa pas batal diklik
    btnCancelSchedule.addEventListener('click', () => {
      scheduleModal.style.display = 'none';
    });
    // ngelempar data json jadwal baru ke firebase pas tombol simpan diklik
    btnSaveSchedule.addEventListener('click', () => {
      let jamNyala = -1, menitNyala = -1, jamMati = -1, menitMati = -1;
      if (timeOn.value) {
        const partsOn = timeOn.value.split(':');
        jamNyala = parseInt(partsOn[0]);
        menitNyala = parseInt(partsOn[1]);
      }
      if (timeOff.value) {
        const partsOff = timeOff.value.split(':');
        jamMati = parseInt(partsOff[0]);
        menitMati = parseInt(partsOff[1]);
      }
      const dataJadwal = {
        aktif: scheduleActive.checked,
        jamNyala: jamNyala,
        menitNyala: menitNyala,
        jamMati: jamMati,
        menitMati: menitMati
      };
      for (let i = 0; i <= 6; i++) {
        dataJadwal[`hari${i}`] = document.getElementById(`day-${i}`).checked;
      }
      btnSaveSchedule.innerText = 'Menyimpan...';
      btnSaveSchedule.disabled = true;
      set(ref(db, `jadwal/relay${relayJadwalAktif}`), dataJadwal).then(() => {
        alert("Informasi: Jadwal berhasil disimpan.");
        scheduleModal.style.display = 'none';
      }).catch(() => {
        alert("Kesalahan: Gagal menyimpan jadwal ke server.");
      }).finally(() => {
        btnSaveSchedule.innerText = 'Simpan Pengaturan';
        btnSaveSchedule.disabled = false;
      });
    });
    // jalanin fungsinyaa sekali pas halaman webnyaa pertama kali kebuka
    updateConnectionStatus();
  </script>
</body>

</html>
